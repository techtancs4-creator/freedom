
name: Keep FREEDOM SMP Website Active

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FREEDOM SMP Website
        run: |
          curl --location --silent --show-error \
            --max-time 120 \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
            https://freedomsmp.2bd.net/
